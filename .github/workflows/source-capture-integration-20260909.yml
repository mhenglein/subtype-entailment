name: Checked source-capture research integration

on:
  push:
    branches:
      - research/source-capture-20260909-checks

permissions:
  contents: write

jobs:
  reconcile-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Reconcile with concurrent research on the pinned main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/reconcile_source_capture.py "$RUNNER_TEMP/reconcile_source_capture.py"
          python3 "$RUNNER_TEMP/reconcile_source_capture.py"
      - name: Replay source capture, shared records and concurrent regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/source_capture.py experiments/check_source_capture.py
          python3 scripts/research_index.py --check
          python3 -m unittest discover -s scripts -p 'test_research_index.py' -v
          python3 experiments/check_source_capture.py
          cmp "$RUNNER_TEMP/source_capture_bundle/results/source-capture.json" results/source-capture.json
          python3 experiments/run_experiments.py
          python3 experiments/check_one_flag_counting.py
          python3 experiments/check_guarded_order_chains.py
          python3 experiments/check_trailing_copy_barrier.py
          git diff --check
          git diff --exit-code -- experiments/border_lab.py experiments/_word_smt_native.py results/independent-checks.json results/one-flag-counting.json results/guarded-order-chains.json results/trailing-copy-barrier.json .github/workflows
      - name: Publish the reconciled research commit without temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {'experiments/source_capture.py', 'experiments/check_source_capture.py', 'notes/2026-09-09-source-capture-word-equations.md', 'research/conjectures/Q004.md', 'results/source-capture.json', 'results/source-capture-smt.json', 'research/claims.md', 'experiments/README.md', 'STATE.md', 'research/PLAN.md', 'notes/2026-09-08-single-source-shape-lemmas.md', 'notes/2026-09-09-single-source-primitivity-correction.md', 'notes/2026-09-08-strategy-review-and-period-state-form.md', 'research/approaches.json', 'research/README.md', 'research/approaches/A017.md', 'research/approaches/A011.md', 'research/approaches/A012.md', 'research/approaches/A008.md', 'research/conjectures/README.md', 'research/ONE_FLAG_COUNTING.md'}
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed == expected, sorted(changed ^ expected)
          subprocess.run(['git','add','--'] + sorted(expected),check=True)
          PY
          git diff --cached --check
          git diff --cached --stat
          test ! -e .github/source_capture_payload
          test ! -e .github/reconcile_source_capture.py
          test ! -e .github/workflows/source-capture-integration-20260909.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate single-source capture decision alongside concurrent counting research' -m 'C067/C068 and E043 record written proofs pending independent mathematical review, exact word-equation compilers and checked regressions. Q004 isolates recurrent-source coverage. Preserve concurrent C065/C066/E042, guarded-order work and all evidence. Index, 11 navigation tests, source-capture reproduction, existing core and all three concurrent regressions passed. Optional Z3 evidence is the recorded local run; no new Lean proof or unrestricted decision is claimed.'
          git push origin HEAD:refs/heads/research/source-capture-20260909-reconciled
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
          echo "Checked reconciled research: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'All targeted and concurrent regressions passed; independent mathematical review pending. Main unchanged by this workflow.' >> "$GITHUB_STEP_SUMMARY"
