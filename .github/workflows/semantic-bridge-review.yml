name: Semantic bridge review

on:
  push:
    paths:
      - 'experiments/check_semantic_bridge_review.py'
      - 'experiments/topfree_bridge.py'
      - 'experiments/summary_bridge.py'
      - 'experiments/safe_extensions.py'
      - 'experiments/infinite_extensions.py'
      - 'experiments/terminal_realization.py'
      - 'experiments/border_lab.py'
      - '.github/workflows/semantic-bridge-review.yml'
  pull_request:
    paths:
      - 'experiments/check_semantic_bridge_review.py'
      - '.github/workflows/semantic-bridge-review.yml'

permissions:
  contents: read

jobs:
  semantic-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Independent grammar and whole-language comparisons
        run: python3 experiments/check_semantic_bridge_review.py --repository --output /tmp/semantic-bridge-review.json
      - name: Deterministic replay
        run: |
          python3 experiments/check_semantic_bridge_review.py --repository --output /tmp/semantic-bridge-review-replay.json
          cmp /tmp/semantic-bridge-review.json /tmp/semantic-bridge-review-replay.json
      - name: No tracked changes
        run: git diff --exit-code
