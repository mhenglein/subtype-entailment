name: Lean rank diagram enumeration

on:
  push:
    branches: ['lean/diagram-enumeration-2026-09-18', 'main']
    paths:
      - 'lean/Subtail/RankQueryEnumeration*.lean'
      - '.github/workflows/lean-rank-enumeration.yml'
  pull_request:
    paths:
      - 'lean/Subtail/RankQueryEnumeration*.lean'
      - '.github/workflows/lean-rank-enumeration.yml'

permissions:
  contents: read

jobs:
  enumeration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Compile finite diagram enumeration
        working-directory: lean
        run: lake build +Subtail.RankQueryEnumeration
      - name: Replay declarations through the kernel
        working-directory: lean
        run: lake env leanchecker Subtail.RankQueryEnumeration
      - name: Audit all new declaration dependencies
        run: |
          mkdir -p tmp
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          source=Path('lean/Subtail/RankQueryEnumeration.lean').read_text()
          rows=re.findall(r'^(def|theorem|structure|abbrev) ([A-Za-z_][A-Za-z_0-9]*)',source,re.M)
          assert rows and len(rows)==len(set(n for _,n in rows))
          Path('tmp/enumeration-declarations.json').write_text(json.dumps(rows))
          Path('tmp/enumeration-axioms.lean').write_text('import Subtail.RankQueryEnumeration\n'+''.join('#print axioms Subtail.RankQueryEnumeration.'+n+'\n' for _,n in rows))
          PY
          cd lean
          set -o pipefail
          lake env lean ../tmp/enumeration-axioms.lean | tee /tmp/enumeration-axioms.txt
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          expected={n:k for k,n in json.loads(Path('tmp/enumeration-declarations.json').read_text())}
          text=Path('/tmp/enumeration-axioms.txt').read_text()
          rows=re.findall(r"'Subtail\.RankQueryEnumeration\.([^']+)' (does not depend on any axioms|depends on axioms: \[([^]]*)\])",text)
          assert set(n for n,_,_ in rows)==set(expected),text
          for name,_,axioms in rows:
              allowed={'propext','Quot.sound'}
              if expected[name]=='theorem': allowed.add('Classical.choice')
              assert set(a.strip() for a in axioms.split(',') if a.strip())<=allowed,(name,axioms)
          print('PASS:',len(rows),'named declaration dependency closures')
          PY
      - name: Preserve earlier Lean core
        run: python3 scripts/check_lean.py
      - name: Preserve tracked evidence
        run: git diff --exit-code -- results/lean-checks.json
