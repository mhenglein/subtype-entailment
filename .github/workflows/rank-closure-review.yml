name: Rank closure separate review

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rank-closure-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Validate research records and links
        run: python3 scripts/research_index.py --check
      - name: Replay separate all-length frontier oracle and compiler comparisons
        run: |
          python3 experiments/check_rank_closure_review.py --output /tmp/rank-closure-review.json --full-output /tmp/rank-closure-review-full.json
          cmp results/rank-closure-review.json /tmp/rank-closure-review.json
      - name: Replay the unchanged candidate compiler suite
        run: |
          python3 experiments/check_rank_preimage.py --output /tmp/rank-preimage.json
          cmp results/rank-preimage.json /tmp/rank-preimage.json
      - name: Ensure tracked evidence is unchanged
        run: git diff --exit-code
