name: Lean finite propagation

on:
  push:
    branches: ['lean/finite-propagation-2026-09-18', 'main']
    paths:
      - 'lean/Subtail/Stack*.lean'
      - 'lean/Subtail/CanonicalReachability.lean'
      - 'experiments/check_stack_summary.py'
      - '.github/workflows/lean-stack-summary.yml'
  pull_request:
    paths:
      - 'lean/Subtail/Stack*.lean'
      - 'lean/Subtail/CanonicalReachability.lean'
      - 'experiments/check_stack_summary.py'
      - '.github/workflows/lean-stack-summary.yml'
permissions:
  contents: read
jobs:
  finite-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Compile finite propagation and semantic checks
        working-directory: lean
        run: lake build +Subtail.StackSummaryAudit
      - name: Replay through the kernel
        working-directory: lean
        run: lake env leanchecker Subtail.StackSummaryAudit
      - name: Audit new declarations
        run: |
          mkdir -p tmp
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          rows=[]
          paths=sorted(Path('lean/Subtail').glob('Stack*.lean'))+[Path('lean/Subtail/CanonicalReachability.lean')]
          for path in paths:
              source=path.read_text()
              for kind,name in re.findall(r'^(?:@\[simp\] )?(def|theorem|inductive|structure|abbrev) ([A-Za-z_][A-Za-z_0-9]*)',source,re.M):
                  rows.append((path.stem+'.'+name,kind))
          assert rows and len(rows)==len(set(n for n,_ in rows))
          Path('tmp/stack-declarations.json').write_text(json.dumps(rows))
          imports=''.join('import Subtail.'+m+'\n' for m in sorted(set(n.split('.')[0] for n,_ in rows)))
          Path('tmp/stack-axioms.lean').write_text(imports+''.join('#print axioms Subtail.'+n+'\n' for n,_ in rows))
          PY
          cd lean
          set -o pipefail
          lake env lean ../tmp/stack-axioms.lean | tee /tmp/stack-axioms.txt
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          expected=dict(json.loads(Path('tmp/stack-declarations.json').read_text()))
          rows=re.findall(r"'Subtail\.([^']+)' (does not depend on any axioms|depends on axioms: \[([^]]*)\])",Path('/tmp/stack-axioms.txt').read_text())
          assert set(n for n,_,_ in rows)==set(expected)
          for name,_,ax in rows:
              allowed={'propext','Quot.sound'}
              if expected[name]=='theorem':allowed.add('Classical.choice')
              assert set(a.strip() for a in ax.split(',') if a.strip())<=allowed,(name,ax)
          print('PASS:',len(rows),'declaration dependency closures')
          PY
      - name: Independent saturation oracle and native agreement
        run: |
          python3 experiments/check_stack_summary.py --lean --output /tmp/stack-summary-native.json
          PYTHONHASHSEED=91 python3 experiments/check_stack_summary.py --lean --output /tmp/stack-summary-replay.json
          cmp /tmp/stack-summary-native.json /tmp/stack-summary-replay.json
      - name: Preserve earlier Lean core
        run: python3 scripts/check_lean.py
      - name: Preserve tracked evidence
        run: git diff --exit-code -- results/lean-checks.json
