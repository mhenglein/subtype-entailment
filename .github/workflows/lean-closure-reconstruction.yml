name: Lean closure reconstruction

on:
  push:
    branches: ['lean/closure-reconstruction-2026-09-18', 'main']
    paths:
      - 'lean/Subtail/RankQueryReconstruction*.lean'
      - '.github/workflows/lean-closure-reconstruction.yml'
      - 'experiments/check_closure_reconstruction.py'
  pull_request:
    paths:
      - 'lean/Subtail/RankQueryReconstruction*.lean'
      - '.github/workflows/lean-closure-reconstruction.yml'

permissions:
  contents: read

jobs:
  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Package pinned public toolchain and proof sources
        if: github.ref == 'refs/heads/lean/closure-reconstruction-2026-09-18'
        run: |
          tar --use-compress-program='zstd -1 -T0' -cf /tmp/lean-proof-bootstrap.tar.zst --exclude='.lake' --exclude='.git' -C "$HOME/.elan/toolchains" leanprover--lean4---v4.33.1 -C "$GITHUB_WORKSPACE" lean
          sha256sum /tmp/lean-proof-bootstrap.tar.zst
      - name: Retain bootstrap for this isolated proof check
        if: github.ref == 'refs/heads/lean/closure-reconstruction-2026-09-18'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-proof-bootstrap
          path: /tmp/lean-proof-bootstrap.tar.zst
          retention-days: 1
          compression-level: 0
      - name: Compile every new reconstruction module
        working-directory: lean
        run: |
          for source in Subtail/RankQueryReconstruction*.lean; do
            target="${source%.lean}"
            target="${target//\//.}"
            lake build "+$target"
          done
      - name: Replay every new module through kernel
        working-directory: lean
        run: |
          for source in Subtail/RankQueryReconstruction*.lean; do
            target="${source%.lean}"
            target="${target//\//.}"
            lake env leanchecker "$target"
          done
      - name: Audit all new public declarations
        run: |
          mkdir -p tmp
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          rows=[]
          paths=sorted(Path('lean/Subtail').glob('RankQueryReconstruction*.lean'))
          for path in paths:
              source=path.read_text()
              rows += re.findall(r'^(?:@\[simp\] )?(def|theorem|inductive|structure|abbrev) ([A-Za-z_][A-Za-z_0-9]*)',source,re.M)
          assert rows and len(rows)==len(set(n for _,n in rows))
          Path('tmp/reconstruction-declarations.json').write_text(json.dumps(rows))
          imports=''.join('import Subtail.'+p.stem+'\n' for p in paths)
          Path('tmp/reconstruction-axioms.lean').write_text(imports+''.join('#print axioms Subtail.RankQueryReconstruction.'+n+'\n' for _,n in rows))
          PY
          cd lean
          set -o pipefail
          lake env lean ../tmp/reconstruction-axioms.lean | tee /tmp/reconstruction-axioms.txt
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          expected={n:k for k,n in json.loads(Path('tmp/reconstruction-declarations.json').read_text())}
          text=Path('/tmp/reconstruction-axioms.txt').read_text()
          rows=re.findall(r"'Subtail\.RankQueryReconstruction\.([^']+)' (does not depend on any axioms|depends on axioms: \[([^]]*)\])",text)
          assert set(n for n,_,_ in rows)==set(expected),text
          for name,_,axioms in rows:
              allowed={'propext','Quot.sound'}
              if expected[name]=='theorem':allowed.add('Classical.choice')
              assert set(a.strip() for a in axioms.split(',') if a.strip())<=allowed,(name,axioms)
          print('PASS:',len(rows),'complete declaration dependency closures')
          PY
      - name: Preserve existing Lean core
        run: python3 scripts/check_lean.py
      - name: Verify tracked evidence unchanged
        run: git diff --exit-code -- results/lean-checks.json
