          assert phases['generated']['counts']['prepared'] == {'PASS': 19}, phases['generated']['counts']
          # The preceding E055 step already runs EntailmentFast on this tree.
          # Compare that result instead of launching a third copy of the baseline.
          prior = json.loads(Path('tmp/entailment-fast.json').read_text())['phases']
          for old_rows, new_rows, old_key in (
              (prior['benchmark']['cases'], benchmark['cases'], 'candidate'),
              (prior['generated']['rows'], phases['generated']['rows'], 'run')):
              before = {row['name']: row[old_key] for row in old_rows}
              after = {row['name']: row['prepared'] for row in new_rows}
              assert before.keys() == after.keys()
              for name in before:
