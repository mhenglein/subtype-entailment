name: Recovered source-walk research

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recovered-source-walks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Validate canonical research records and links
        run: python3 scripts/research_index.py --check
      - name: Replay both bundles and verify every original checksum
        run: python3 experiments/recovered_2026_09_12/reproduce.py
      - name: Ensure replay did not change tracked evidence
        run: git diff --exit-code
