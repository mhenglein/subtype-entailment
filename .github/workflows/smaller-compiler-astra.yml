name: Smaller compiler existential contract

on:
  push:
    branches: ['codex/smaller-compiler-20260920-astra']
    paths:
      - 'lean/Subtail/SmallerCompilerAstra.lean'
      - 'experiments/check_smaller_compiler_astra.py'
      - 'results/smaller-compiler-astra.json'
      - '.github/workflows/smaller-compiler-astra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smaller-compiler-astra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiler-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Compile the isolated full contract
        working-directory: lean
        run: lake build +Subtail.SmallerCompilerAstra
      - name: Independent kernel replay
        working-directory: lean
        run: lake env leanchecker Subtail.SmallerCompilerAstra
      - name: Audit declaration dependencies and executable definitions
        working-directory: lean
        run: |
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          source = Path('Subtail/SmallerCompilerAstra.lean').read_text()
          prefix = 'Subtail.SmallerCompilerAstra.'
          pairs = re.findall(r'^(def|theorem)\s+(\w+)', source, re.M)
          names = [prefix + name for _, name in pairs]
          audit = Path('_SmallerCompilerAstraAudit.lean')
          audit.write_text('import Subtail.SmallerCompilerAstra\n' +
                           '\n'.join('#print axioms ' + name for name in names) + '\n')
          text = subprocess.check_output(['lake', 'env', 'lean', str(audit)], text=True, timeout=180)
          print(text)
          entries = re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)", text)
          found = {name: set(filter(None, (a.strip() for a in axioms.split(','))))
                   for name, axioms in entries}
          if set(found) != set(names):
              raise SystemExit('Incomplete dependency readback: ' + repr(set(names) - set(found)))
          allowed = {'propext', 'Quot.sound', 'Classical.choice'}
          for name, axioms in found.items():
              if not axioms <= allowed:
                  raise SystemExit('Unexpected axiom in ' + name + ': ' + repr(axioms))
          for kind, name in pairs:
              if kind == 'def' and 'Classical.choice' in found[prefix + name]:
                  raise SystemExit('Classical.choice in executable definition ' + name)
          print(json.dumps({'status': 'PASS', 'declarations': len(names),
                            'source_sha256': hashlib.sha256(source.encode()).hexdigest(),
                            'runtime_choice_free': True}, indent=2))
          PY
      - name: Native compact-guard and empty-query comparison
        working-directory: lean
        run: |
          cat > _SmallerCompilerAstraRuntime.lean <<'EOF'
          import Subtail.SmallerCompilerAstra
          open Subtail Subtail.RankQueryWeightCounterexample Subtail.SmallerCompilerAstra
          #eval compact inst input diagram
          #eval (preSmall inst []).length
          EOF
          lake env lean _SmallerCompilerAstraRuntime.lean | tee /tmp/smaller-compiler-native.txt
          printf 'false\n0\n' > /tmp/smaller-compiler-native-expected.txt
          cmp /tmp/smaller-compiler-native-expected.txt /tmp/smaller-compiler-native.txt
      - name: Independent literal graph and unchanged Python compiler comparison
        if: ${{ hashFiles('experiments/check_smaller_compiler_astra.py') != '' }}
        run: |
          timeout 120s python3 experiments/check_smaller_compiler_astra.py --output /tmp/smaller-compiler-standalone.json
          cmp results/smaller-compiler-astra.json /tmp/smaller-compiler-standalone.json
          timeout 120s python3 experiments/check_smaller_compiler_astra.py --repository --output /tmp/smaller-compiler-repository.json
          cat /tmp/smaller-compiler-repository.json
