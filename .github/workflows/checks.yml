name: Research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  organization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Validate shared research records
        run: python3 scripts/research_index.py --check
      - name: Test research navigation guards
        run: python3 -m unittest discover -s scripts -p 'test_research_index.py'
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Run reproducible experiments
        run: |
          python3 experiments/run_experiments.py
          python3 experiments/check_topfree_bridge.py
          python3 experiments/check_context_cuts.py
          python3 experiments/search_budgets.py --replay-stored
          python3 experiments/check_boundary_slices.py
          python3 experiments/check_summary_bridge.py
          python3 experiments/check_summary_bridge_audit.py
          python3 experiments/check_minimal_structure.py
          python3 experiments/shortest_witnesses.py
          python3 experiments/trim_budget_example.py
          python3 experiments/check_marker_tails.py
      - name: Verify recorded results
        run: git diff --exit-code -- results/independent-checks.json results/topfree-bridge.json results/context-cuts.json results/budget-search.json results/boundary-slices.json results/summary-bridge.json results/summary-bridge-audit.json results/shortest-witnesses.json results/trimmed-budget.json results/semantic-marker-tails.json
  continuation-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Run consolidated continuation regressions
        run: |
          python3 experiments/check_modular_sync.py
          python3 experiments/check_terminal_copy.py
          python3 experiments/check_word_sync.py
          python3 experiments/check_delimited_blocks.py
          python3 experiments/check_marker_certificate.py
          python3 experiments/check_target_frontier.py
          python3 experiments/check_target_tail.py
          python3 experiments/check_run_normalization.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Check proofs, axioms, and Python agreement
        run: python3 scripts/check_lean.py
      - name: Verify recorded Lean results
        run: git diff --exit-code -- results/lean-checks.json
