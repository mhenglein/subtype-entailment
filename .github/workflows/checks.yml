name: Research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Validate research organization
        run: python3 scripts/research_index.py --check
      - name: Run reproducible experiments
        run: python3 experiments/run_experiments.py
      - name: Verify recorded results
        run: git diff --exit-code -- results/independent-checks.json
