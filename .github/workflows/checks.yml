name: Research checks

# CI diet (2026-09-19, #37): this workflow now carries only the cheap
# organization check, which must run on every change (docs included). The
# experiment suites moved to experiments.yml and the Lean job to lean.yml, both
# path-filtered. Branch pushes do not run CI: open a DRAFT pull request to get
# CI on a branch (each push then runs once, not twice).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  organization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Validate shared research records
        run: python3 scripts/research_index.py --check
      - name: Test research navigation guards
        run: python3 -m unittest discover -s scripts -p 'test_research_index.py'
