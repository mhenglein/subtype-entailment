name: Source-capture checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Check capture, normalization and boundary counterexamples
        run: python3 experiments/check_source_capture.py
      - name: Verify deterministic evidence
        run: git diff --exit-code -- results/source-capture.json
