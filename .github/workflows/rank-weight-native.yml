name: Rank weight native proofs

on:
  pull_request:
    paths:
      - 'lean/Subtail/RankQueryWeightCounterexample.lean'
      - 'lean/Subtail/RankQueryWeightBound.lean'
      - 'lean/Subtail/RankQueryLengthBound.lean'
      - 'scripts/check_rank_weight_native.py'
      - '.github/workflows/rank-weight-native.yml'

permissions:
  contents: read

concurrency:
  group: rank-weight-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_STACK_SIZE_KB: '32768'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Restore pinned toolchain
        uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Restore isolated build cache
        uses: actions/cache@v6.1.0
        with:
          path: lean/.lake
          key: rank-weight-lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: |
            rank-weight-lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Compile, kernel-replay and audit additive proofs
        env:
          RANK_WEIGHT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ulimit -v 16777216
          ulimit -t 1200
          python3 scripts/check_rank_weight_native.py
      - name: Ensure tracked sources were not modified
        if: always()
        run: git diff --exit-code
      - name: Export isolated offline workbench
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          prefix = pathlib.Path(subprocess.check_output(
              ['lake', 'env', 'lean', '--print-prefix'], cwd=root/'lean', text=True).strip())
          allowed_bins = {'lean', 'lake', 'leanchecker'}
          def keep(info):
              p = pathlib.PurePosixPath(info.name)
              if info.isdir():
                  return info
              if str(p).startswith('toolchain/bin/'):
                  return info if p.name in allowed_bins else None
              name = p.name
              if '.olean' in name or '.so' in name or name.endswith(('.lean', '.ir')):
                  return info
              return None
          archive = pathlib.Path('/tmp/rank-weight-workbench.tar.gz')
          with tarfile.open(archive, 'w:gz', compresslevel=1) as tar:
              for part in ['bin', 'lib', 'src']:
                  if (prefix/part).exists():
                      tar.add(prefix/part, arcname='toolchain/'+part, filter=keep)
              tracked = subprocess.check_output(['git', 'archive', 'HEAD', 'lean', 'scripts/check_rank_weight_native.py'])
              with tarfile.open(fileobj=io.BytesIO(tracked), mode='r:') as source:
                  for item in source:
                      payload = source.extractfile(item) if item.isfile() else None
                      item.name = 'repo/' + item.name
                      tar.addfile(item, payload)
              compiled = root/'lean/.lake/build/lib/lean'
              if compiled.exists():
                  tar.add(compiled, arcname='repo/lean/.lake/build/lib/lean')
              data = json.dumps({'source_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                                 'toolchain': 'leanprover/lean4:v4.33.1',
                                 'contents': 'pinned compiler runtime, tracked Lean sources, compiled proof dependencies; no credentials or git configuration'}).encode()
              info = tarfile.TarInfo('provenance.json'); info.size = len(data)
              tar.addfile(info, io.BytesIO(data))
          print('workbench_bytes', archive.stat().st_size)
          PY
          split -b 350M /tmp/rank-weight-workbench.tar.gz /tmp/rank-weight-workbench.part-
      - name: Upload temporary workbench part aa
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rank-weight-workbench-aa
          path: /tmp/rank-weight-workbench.part-aa
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload temporary workbench part ab
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rank-weight-workbench-ab
          path: /tmp/rank-weight-workbench.part-ab
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload temporary workbench part ac
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rank-weight-workbench-ac
          path: /tmp/rank-weight-workbench.part-ac
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
