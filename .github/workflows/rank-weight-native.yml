name: Rank weight native proofs

on:
  pull_request:
    paths:
      - 'lean/**'
      - 'scripts/check_rank_weight_native.py'
      - '.github/workflows/rank-weight-native.yml'
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - 'scripts/check_rank_weight_native.py'
      - '.github/workflows/rank-weight-native.yml'

permissions:
  contents: read

concurrency:
  group: rank-weight-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_STACK_SIZE_KB: '32768'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Restore pinned toolchain
        uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Restore isolated build cache
        uses: actions/cache@v6.1.0
        with:
          path: lean/.lake
          key: rank-weight-lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: |
            rank-weight-lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Compile, kernel-replay and audit additive proofs
        env:
          RANK_WEIGHT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ulimit -v 16777216
          ulimit -t 1200
          python3 scripts/check_rank_weight_native.py
      - name: Ensure tracked sources were not modified
        if: always()
        run: git diff --exit-code
      - name: Upload exact-source audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rank-weight-native-audit
          path: tmp/rank-weight-native.json
          retention-days: 90
          if-no-files-found: error
