name: Lean rank milestones

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Compile literal rank and first-return proofs
        working-directory: lean
        run: lake build +Subtail.RankMilestones
      - name: Replay declarations through the kernel
        working-directory: lean
        run: lake env leanchecker Subtail.RankMilestones
      - name: Audit every new public declaration
        run: |
          mkdir -p tmp
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('lean/Subtail/RankMilestones.lean').read_text()
          rows = re.findall(r'^(?:@\[simp\] )?(def|theorem) ([A-Za-z_][A-Za-z_0-9]*)', source, re.M)
          assert len(rows) >= 18 and len(rows) == len(set(n for _,n in rows))
          Path('tmp/milestone-axioms.lean').write_text('import Subtail.RankMilestones\n' + ''.join('#print axioms Subtail.RankMilestones.'+n+'\n' for _,n in rows))
          PY
          cd lean
          set -o pipefail
          lake env lean ../tmp/milestone-axioms.lean | tee /tmp/milestone-axioms.txt
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('lean/Subtail/RankMilestones.lean').read_text()
          expected = dict((n,k) for k,n in re.findall(r'^(?:@\[simp\] )?(def|theorem) ([A-Za-z_][A-Za-z_0-9]*)',source,re.M))
          text = Path('/tmp/milestone-axioms.txt').read_text()
          rows = re.findall(r"'Subtail\.RankMilestones\.([^']+)' (does not depend on any axioms|depends on axioms: \[([^]]*)\])",text)
          assert set(n for n,_,_ in rows) == set(expected), text
          for name,_,axioms in rows:
              allowed = {'propext','Quot.sound'}
              if expected[name] == 'theorem': allowed.add('Classical.choice')
              assert set(a.strip() for a in axioms.split(',') if a.strip()) <= allowed, (name,axioms)
          print('PASS:',len(rows),'complete axiom dependency closures')
          PY
      - name: Preserve earlier Lean core
        run: python3 scripts/check_lean.py
      - name: Verify existing evidence unchanged
        run: git diff --exit-code -- results/lean-checks.json
