name: Expression normalization

on:
  pull_request:
    paths:
      - 'lean/Subtail/ExpressionNormalization*.lean'
      - '.github/workflows/lean-expression-normalization.yml'
      - 'experiments/check_expression_normalization_lean.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expression-normalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Build the normalization and audit dependency closure
        working-directory: lean
        run: lake build +Subtail.ExpressionNormalizationAudit
      - name: Independent kernel replay
        working-directory: lean
        run: |
          lake env leanchecker Subtail.ExpressionNormalization
          lake env leanchecker Subtail.ExpressionNormalizationAudit
      - name: Reject unfinished declarations
        run: "! grep -nE '\\bsorry\\b|sorryAx|^axiom |native_decide' lean/Subtail/ExpressionNormalization*.lean"
      - name: Audit all named declarations and executable definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python3 - <<'PY'
          import pathlib, re
          decls = []
          for path in sorted(pathlib.Path('lean/Subtail').glob('ExpressionNormalization*.lean')):
              for kind, name in re.findall(r'^(def|theorem|structure|inductive|abbrev)\s+([\w.]+)', path.read_text(), re.M):
                  full = name if name == 'main' else 'Subtail.ExpressionNormalization.' + name
                  decls.append((kind, full))
          for filename, names in [('all', [n for k,n in decls]), ('runtime', [n for k,n in decls if k != 'theorem'])]:
              out = ['import Subtail.ExpressionNormalizationAudit'] + ['#print axioms ' + n for n in names]
              pathlib.Path('tmp/normalization-' + filename + '.lean').write_text('\n'.join(out) + '\n')
              print(filename, 'declaration count:', len(names))
          PY
          cd lean
          lake env lean ../tmp/normalization-all.lean | tee ../tmp/normalization-all.txt
          lake env lean ../tmp/normalization-runtime.lean | tee ../tmp/normalization-runtime.txt
          python3 - <<'PY'
          import pathlib, re
          for filename, allowed in [('all', {'propext','Quot.sound','Classical.choice'}), ('runtime', {'propext','Quot.sound'})]:
              text = pathlib.Path('../tmp/normalization-' + filename + '.txt').read_text()
              for group in re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text):
                  found = {x.strip() for x in group.split(',') if x.strip()}
                  assert found <= allowed, (filename, found)
              assert 'sorryAx' not in text and 'error:' not in text
              if filename == 'runtime':
                  assert 'Classical.choice' not in text
          PY
      - name: Compare native compiler with independent finite-set oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          (cd lean && lake env lean --run Subtail/ExpressionNormalizationAudit.lean) > tmp/normalization-native.jsonl
          python3 experiments/check_expression_normalization_lean.py --lean-output tmp/normalization-native.jsonl | tee tmp/expression-normalization-result.json
