name: Source scheme cost and switching
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scheme-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Validate canonical research records
        run: python3 scripts/research_index.py --check
      - name: Replay exact cost and switching checks
        run: |
          python3 experiments/scheme_cost_barrier.py --self-test --output "$RUNNER_TEMP/scheme-cost.json"
          cmp results/scheme-cost.json "$RUNNER_TEMP/scheme-cost.json"
          python3 experiments/check_suffix_switch.py --output "$RUNNER_TEMP/suffix-switch.json"
          cmp results/suffix-switch.json "$RUNNER_TEMP/suffix-switch.json"
      - name: Check no tracked evidence changed
        run: git diff --exit-code
