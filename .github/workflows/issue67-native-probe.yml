name: Issue 67 isolated native probe
on:
  push:
    branches: [codex/issue67-native-followup-20260920]
    paths:
      - lean/Issue67NativeProbe.lean
      - experiments/issue67_native_probe.py
      - .github/workflows/issue67-native-probe.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: lean/.lake
          key: issue67-lake-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Build native dependencies and typecheck probe
        working-directory: lean
        run: |
          lake build +Subtail.EntailmentPrepared +Subtail.TerminalDecisionLazy
          lake env lean Issue67NativeProbe.lean
          lake env leanchecker Subtail.RankQueryDecision
          lake env leanchecker Subtail.TerminalDecisionLazy
      - name: Resource harness guards
        run: python3 experiments/issue67_native_probe.py --mode selftest --output tmp/issue67-native/selftest.json
      - name: Strict native acceptance
        run: python3 experiments/issue67_native_probe.py --output tmp/issue67-native/acceptance.json
      - name: Native capped stress
        if: ${{ !cancelled() }}
        run: python3 experiments/issue67_native_probe.py --mode stress --output tmp/issue67-native/stress.json
      - name: Retain exact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue67-native-${{ github.sha }}
          path: tmp/issue67-native/
          if-no-files-found: warn
